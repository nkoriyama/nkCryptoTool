[package]
name = "nkct-p2p-shim"
version = "0.1.0"
edition = "2021"

# Thin C-ABI wrapper over iroh 1.0's low-level transport (Endpoint / Connection /
# bidirectional streams / custom ALPN) so the C++ nkCryptoTool can run its
# existing app-layer PQC handshake + chat/scp framing over the SAME iroh
# transport the Rust version uses — and therefore interoperate. This is step ①
# of the P2P-in-C++ plan: prove the shim links and iroh comes up from C++.

[lib]
name = "nkct_p2p"
crate-type = ["staticlib", "cdylib"]

[dependencies]
iroh = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
once_cell = "1"
data-encoding = "2"
crc = "3"
